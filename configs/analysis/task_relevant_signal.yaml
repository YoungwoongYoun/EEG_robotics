id: task_relevant_signal
source_arrays_dir: artifacts/preprocessed/bcic2a/canonical_mi9/arrays
output_dir: artifacts/experiments/analysis/task_relevant_signal

# Main-study methods only. Direct MI-9 is represented by zero-padding for
# full-22 signal-space endpoints; ablations remain in their separate study.
methods:
  - id: true22
    label: True 22-channel
    kind: true22
  - id: zero_padded_mi9
    label: Zero-padded MI-9
    kind: zero_padded
  - id: spherical_spline
    label: Spherical spline
    kind: restored
    test_path: artifacts/model_inputs/restored/spherical_spline/canonical_mi9/arrays/test.npz
    array_key: x_restored22
  - id: autoencoder
    label: Autoencoder
    kind: restored
    test_path: artifacts/model_inputs/restored/autoencoder/canonical_mi9/arrays/test.npz
    array_key: x_restored22
  - id: autoencoder_eeg_aware
    label: EEG-aware autoencoder
    kind: restored
    test_path: artifacts/model_inputs/restored/autoencoder/eeg_aware_canonical_mi9/arrays/test.npz
    array_key: x_restored22
  - id: ddpm_standard
    label: Standard DDPM
    kind: restored
    test_path: artifacts/model_inputs/restored/diffusion/standard_canonical_mi9/arrays/test.npz
    array_key: x_restored22
  - id: wgan_gp
    label: Conditional WGAN-GP
    kind: restored
    test_path: artifacts/model_inputs/restored/gan/wgan_gp_canonical_mi9/arrays/test.npz
    array_key: x_restored22

analysis:
  sampling_rate: 250.0
  bands:
    mu: [8.0, 13.0]
    beta: [13.0, 30.0]
  total_band: [8.0, 30.0]
  covariance_ridge: 0.001
  csp_filters_per_class: 2
  bootstrap_samples: 10000
  random_seed: 20260812
  tfr_window_samples: 128
  tfr_overlap_samples: 96
