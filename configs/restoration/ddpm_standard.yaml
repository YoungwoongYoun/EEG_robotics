name: ddpm_standard
method: ddpm
seed: 0
device: cuda:0

source:
  arrays_dir: artifacts/preprocessed/bcic2a/canonical_mi9/arrays
  normalization_dir: artifacts/preprocessed/bcic2a/canonical_mi9/normalization
  input_key: x_mi9
  target_key: x_true22

output:
  arrays_dir: artifacts/model_inputs/restored/diffusion/standard_canonical_mi9/arrays
  experiment_dir: artifacts/experiments/restoration/diffusion/standard_canonical_mi9
  array_key: x_restored22

training:
  epochs: 300
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.0
  optimizer: adam
  beta_1: 0.9
  beta_2: 0.999
  patience: 30
  min_delta: 0.000001
  num_workers: 0
  amp: true
  deterministic: true
  allow_tf32: true

model:
  base_channels: 64
  time_dimension: 128

diffusion:
  # With 1000 linear steps alpha_bar_T is approximately 4e-5, so reverse
  # diffusion can validly start from Gaussian noise. T=200 left alpha_bar_T
  # near 0.132 and caused a train/inference terminal-distribution mismatch.
  timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02

inference:
  batch_size: 32
  seed: 1000
  sampler: ddim
  sampling_steps: 100
  eta: 0.0
